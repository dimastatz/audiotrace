title: Reads out a full social security number
intent: cancellation
agent: {voice: am_eric}
caller: {voice: af_jessica}
line: phone
expect: {consent: true, pii: true, frustration: false, interruptions: 0, slow_agent: false, drop_off: false}
turns:
