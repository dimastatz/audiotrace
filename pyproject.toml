[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiotrace"
version = "1.3.0"
description = "Structured analysis for voice-agent call recordings — transcript, quality, sentiment, latency, cost, and events from raw audio."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "AudioTrace contributors" }]
keywords = ["voice", "ai", "observability", "transcription", "telephony"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "pydantic>=2,<3",
    "rich>=13",
    "openai-whisper",
    "pyannote.audio",
    "librosa",
    "transformers>=4.30",
]

[project.optional-dependencies]
# Provider adapters use the standard library (PRD 0012); these extras are kept
# as no-op aliases so existing install commands keep working.
vapi = []
retell = []
twilio = []
elevenlabs = []
deepgram = []
# Simulated callers (PRD 0010): Claude plays the caller, Kokoro voices it.
# The Anthropic SDK needs Python 3.10+; Kokoro supports 3.10-3.12.
simulate = [
    "anthropic>=1; python_version >= '3.10'",
    "kokoro>=0.9; python_version >= '3.10' and python_version < '3.13'",
    "pyyaml>=6",
    "websockets>=12",
]
# Production replay (PRD 0011): cloud sources are optional; local dirs and
# provider adapters need nothing extra.
replay = ["pyyaml>=6", "boto3>=1.28", "google-cloud-storage>=2"]
all = ["audiotrace[vapi,retell,twilio,elevenlabs,deepgram,simulate,replay]"]
# Everything needed to develop, test, lint, and type-check the library.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyyaml>=6",
    "types-PyYAML",
    "anthropic>=1; python_version >= '3.10'",
    "websockets>=12",
]

[project.scripts]
audiotrace = "audiotrace.cli:main"

[project.urls]
Homepage = "https://github.com/audiotrace/audiotrace"
Repository = "https://github.com/audiotrace/audiotrace"

[tool.hatch.build.targets.sdist]
# Keep the source distribution lean: the golden call set (~3 MB of audio),
# doc images, and local Claude settings aren't needed to build or test the
# library from source.
exclude = ["tests/fixtures/golden", "docs/imgs", ".claude"]

[tool.hatch.build.targets.wheel]
packages = ["src/audiotrace"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=audiotrace --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["audiotrace"]
branch = true
omit = ["src/audiotrace/boot.py", "src/audiotrace/cli.py"]

[tool.coverage.report]
show_missing = true

# Library targets 3.9+ (ruff enforces py39 syntax); mypy checks against 3.10,
# its lowest supported target. `from __future__ import annotations` keeps the
# modern annotation syntax valid at runtime on 3.9.
[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
